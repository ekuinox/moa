[package]
name = "moa"
version = "0.1.0"
description = "Desktop bookkeeping application"
authors = ["ekuinox"]
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "moa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
