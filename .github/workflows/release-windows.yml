name: Windows Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-signed:
    name: Windows signed build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        env:
          MISE_JOBS: 1
        with:
          install: true
          cache: true

      - name: Install frontend dependencies
        run: pnpm.cmd --dir frontend install --frozen-lockfile

      - name: Install Trusted Signing CLI
        run: cargo install trusted-signing-cli

      - name: Build signed Windows bundle
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MOA_WINDOWS_SIGNING_ENDPOINT: ${{ secrets.MOA_WINDOWS_SIGNING_ENDPOINT }}
          MOA_WINDOWS_SIGNING_ACCOUNT_NAME: ${{ secrets.MOA_WINDOWS_SIGNING_ACCOUNT_NAME }}
          MOA_WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.MOA_WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: pnpm.cmd --dir frontend tauri build --config ../backend/tauri.windows-signed.conf.json --bundles nsis

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @(
            Get-Item -LiteralPath backend/target/release/moa.exe
            Get-ChildItem -Path backend/target/release/bundle/nsis -Recurse -Include *.exe
          )
          if (-not $targets) {
            throw "No Windows artifacts were found to verify."
          }

          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($target.FullName): $($signature.Status)"
            }
          }

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moa-windows-signed-${{ github.sha }}
          if-no-files-found: error
          path: |
            backend/target/release/moa.exe
            backend/target/release/bundle/nsis/**/*.exe
