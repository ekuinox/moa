[tools]
node = "20.19.0"
"npm:pnpm" = "10.32.1"

[tasks.dev]
run = "pnpm dev"

[tasks.build]
run = "pnpm build"

[tasks.fmt]
run = [
  "pnpm fmt",
  "cargo fmt --manifest-path backend/Cargo.toml",
]

[tasks.lint]
run = [
  "pnpm lint",
  "cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings",
]

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.test]
run = [
  "pnpm test",
  "cargo test --manifest-path backend/Cargo.toml",
]

[tasks.storybook]
run = "pnpm storybook"

[tasks."test:e2e"]
run = "pnpm test:e2e"

[tasks.validate]
depends = ["fmt", "lint", "typecheck", "test"]
